services :
  mariadb:
    build: requirements/mariadb/.
    ports:
      - 3306
    environment:
      MYSQL_DB: "db"
      MYSQL_USER: "mysql_user"
    secrets:
      - mariadb_password
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
      - mariadb_network

volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
  mariadb_network:
    driver: bridge

secrets:
  mariadb_password:
    file: ../secrets/db_password.txt
