services :
  mariadb:
    build: requirements/mariadb/.
    ports:
      - "${APP_PORT}"
    volumes:
      - mariadb_volume:/var/db

  wordpress:
    build: requirements/wordpress/.
    ports:
      - "9000"
    volumes:
      - wordpress_volume:/var/www/html

volumes:
  mariadb_volume:
  wordpress_volume:
